<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모형 보기</title>
<style>
:root{--bg:#f3f5f9;--ink:#1c2333;--sub:#5d6678;--line:#e1e5ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;line-height:1.55}
main{max-width:560px;margin:0 auto;padding:28px 16px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
h1{font-size:20px;margin:0 0 4px}
p{margin:6px 0;color:var(--sub);font-size:14px}
a.go{display:block;margin-top:10px;padding:14px 16px;border-radius:12px;background:#1c2333;color:#fff;text-decoration:none;font-weight:700;font-size:16px}
a.go small{display:block;font-weight:400;font-size:13px;opacity:.8;margin-top:2px}
a.sub{display:inline-block;margin-top:14px;color:var(--sub);font-size:13px}
.tip{margin-top:12px;font-size:13px;background:#fffbea;border:1px solid #f3e1a0;border-radius:10px;padding:8px 10px;color:#5a4a10}
</style>
</head>
<body>
<main><div class="card" id="box"><p>모형을 불러오는 중…</p></div></main>
<script>
/* 프린트 QR(q.html?코드) → 시뮬레이션 연결표
   I(제목, 금속판, 수용액 이온, 안내) : 기본 실험(index.html)
   L(제목, 금속목록, 넣는 순서)      : 직접 실험(lab.html)
     금속목록 = 반응성 큰 순서 "이름.전하"(미지수는 "이름.문자@값")
     넣는 순서 = i이온:개수N, m금속:개수N, x금속(충분한 양) */
function I(t,p,i,h){return 'index.html?t='+encodeURIComponent(t)+'&p='+p+'&i='+i+(h?'&h='+encodeURIComponent(h):'')}
function L(t,m,s){return 'lab.html?t='+encodeURIComponent(t)+'&m='+m+'&s='+s}
function one(t,url,note){return {t:t,items:[{label:t,url:url}],note:note}}

 'P1-B1':one('예제 B-1',L('예제 B-1 · Ag⁺ 6N + Mg 충분히','Mg.2,Ag.1','iAg:6,xMg')),
 'P1-B2':one('예제 B-2',L('예제 B-2 · Al³⁺ 4N + Mg 충분히','Mg.2,Al.3','iAl:4,xMg')),

 'P1-B4':one('예제 B-4',L('예제 B-4 · Cu²⁺ 6N + Al 2N','Al.3,Cu.2','iCu:6,mAl:2')),

 'P1-B6':one('예제 B-6',L('예제 B-6 · Cu²⁺ 6N + X 충분히','X.a@3,Cu.2','iCu:6,xX')),

 'P1-D5':one('예제 D-5',L('예제 D-5 · Ag⁺ 6N + Cu (t₁ → t₂)','Cu.2,Ag.1','iAg:6,mCu:1,xCu'),'(나)까지가 t₁(Cu N 반응), (다)까지가 t₂예요.'),
 'P1-D6':{t:'예제 D-6',note:'반응성 A > B > C로 놓은 모형이에요.',items:[
   {label:'(가) B²⁺ 수용액 + 금속 A',url:L('예제 D-6 (가) · B²⁺ + A','A.2,B.2,C.1','iB:4,xA')},
   {label:'(나) A²⁺ 수용액 + 금속 C',url:L('예제 D-6 (나) · A²⁺ + C','A.2,B.2,C.1','iA:4,xC')},

 'P2-s2':one('Part 2 유사 2',I('Part 2 유사 2 · 황산 구리(Ⅱ) + Al','Al','Cu')),

 'P2-oS05':one('Part 2 원본 수능 유형 05',I('원본 수능 유형 05 · 질산 은 + Cu','Cu','Ag')),

 'P2-oS07':{t:'Part 2 원본 수능 유형 07',items:[

   {label:'비커 Ⅱ : Bᵇ⁺ 수용액 + 금속 C',url:L('원본 수능 유형 07 · 비커 Ⅱ','C.c@2,A.2,B.b@3','iB:6,xC')}]},
 'P2-s6':{t:'Part 2 유사 6',items:[
   {label:'비커 Ⅰ : A³⁺ 수용액 + 금속 C',url:L('Part 2 유사 6 · 비커 Ⅰ','C.c@2,A.3,B.1','iA:6,xC')},
   {label:'비커 Ⅱ : B⁺ 수용액 + 금속 C',url:L('Part 2 유사 6 · 비커 Ⅱ','C.c@2,A.3,B.1','iB:6,xC')}]},
 'P2-oS09':{t:'Part 2 원본 수능 유형 09',items:[
   {label:'(가) XNO₃ 수용액 + Y',url:L('원본 수능 유형 09 (가) · X⁺ + Y','Z.c@3,Y.2,X.1','iX:6,xY')},
   {label:'(나) Y(NO₃)₂ 수용액 + Z',url:L('원본 수능 유형 09 (나) · Y²⁺ + Z','Z.c@3,Y.2,X.1','iY:6,xZ')}]},
 'P2-s7':{t:'Part 2 유사 7',items:[
   {label:'(가) X(NO₃)₂ 수용액 + Y',url:L('Part 2 유사 7 (가) · X²⁺ + Y','Y.a@2,X.2,Z.1','iX:6,xY')},
   {label:'(나) ZNO₃ 수용액 + X',url:L('Part 2 유사 7 (나) · Z⁺ + X','Y.a@2,X.2,Z.1','iZ:6,xX')}]},
 'P2-oS10':one('Part 2 원본 수능 유형 10',I('원본 수능 유형 10 · 질산 은 + Fe','Fe','Ag')),
 'P2-s8':one('Part 2 유사 8',I('Part 2 유사 8 · 황산 구리(Ⅱ) + Al','Al','Cu')),

 /* ---------- Part 3 ---------- */
 'P3-oU18':one('Part 3 원본 대단원 18',L('원본 대단원 18 · X 이온 → Y → Z','Z.c@3,Y.b@2,X.a@1','iX:6,xY,xZ'),'X~Z의 전하(a, b, c)는 1~3 중 하나예요.'),
 'P3-s1':one('Part 3 유사 1',L('Part 3 유사 1 · X 이온 → Y → Z','Z.c@2,Y.b@3,X.a@1','iX:6,xY,xZ'),'X~Z의 전하(a, b, c)는 1~3 중 하나예요.'),
 'P3-s2':one('Part 3 유사 2',L('Part 3 유사 2 · X 이온 → Y → Z','Z.c@2,Y.b@1,X.a@1','iX:4,xY,xZ'),'X~Z의 전하(a, b, c)는 1~3 중 하나예요.'),
 'P3-oU19':{t:'Part 3 원본 대단원 19',items:[
   {label:'(가) X²⁺ 3N + 금속 Z',url:L('원본 대단원 19 (가)','Z.2,X.2,Y.m@3','iX:3,xZ')},
   {label:'(나) Yᵐ⁺ 3N + 금속 Z',url:L('원본 대단원 19 (나)','Z.2,X.2,Y.m@3','iY:3,mZ:3')}]},
 'P3-s3':{t:'Part 3 유사 3',items:[
   {label:'(가) X²⁺ 3N + 금속 Z',url:L('Part 3 유사 3 (가)','Z.n@3,X.2,Y.m@2','iX:3,xZ')},
   {label:'(나) Yᵐ⁺ 4N + 금속 Z',url:L('Part 3 유사 3 (나)','Z.n@3,X.2,Y.m@2','iY:4,mZ:2')}]},
 'P3-s4':one('Part 3 유사 4',L('Part 3 유사 4 · X²⁺ 6N + Y','Y.m@3,X.2','iX:6,mY:2')),
 'P3-oU20':one('Part 3 원본 대단원 20',L('원본 대단원 20 · BNO₃ + A','A.2,B.1','iB:6,xA')),
 'P3-s5':one('Part 3 유사 5',L('Part 3 유사 5 · B(NO₃)₂ + A','A.1,B.2','iB:6,xA')),
 'P3-s6':one('Part 3 유사 6',L('Part 3 유사 6 · B(NO₃)₃ + A','A.2,B.3','iB:6,xA')),
 'P3-oU21':one('Part 3 원본 대단원 21',L('원본 대단원 21 · Xᵐ⁺ 4N + Y 충분히','Y.1,X.m@2','iX:4,xY')),
 'P3-s7':one('Part 3 유사 7',L('Part 3 유사 7 · Xᵐ⁺ 6N + Y 충분히','Y.2,X.m@3','iX:6,xY')),
 'P3-s8':one('Part 3 유사 8',L('Part 3 유사 8 · Xᵐ⁺ 4N + Y (2N, 8N)','Y.1,X.m@2','iX:4,mY:2,mY:6'),'넣은 Y가 (나) 2N → (다) 8N이 되도록 나눠 넣어요.'),

 /* ---------- Part 4 ---------- */
 'P4-oD24-11':one('Part 4 원본 도선 2024 11번',I('원본 도선고 2024 11번 · 질산 은 + Cu','Cu','Ag')),
 'P4-s1':one('Part 4 유사 1',I('Part 4 유사 1 · 황산 구리(Ⅱ) + Zn','Zn','Cu')),
 'P4-s2':one('Part 4 유사 2',I('Part 4 유사 2 · 염화 알루미늄 + Mg','Mg','Al')),
 'P4-s3':one('Part 4 유사 3',I('Part 4 유사 3 · 묽은 염산 + Zn','Zn','H')),

 'P4-s4':one('Part 4 유사 4',I('Part 4 유사 4 · 질산 은 + Zn','Zn','Ag')),
 'P4-s5':one('Part 4 유사 5',I('Part 4 유사 5 · 황산 구리(Ⅱ) + Mg','Mg','Cu')),

const code=decodeURIComponent(location.search.replace(/^\?/,'').split('&')[0]||'');
const box=document.getElementById('box');
const esc=x=>String(x).replace(/[<>&]/g,'');
const E=MAP[code];
if(E&&E.items.length===1&&!E.note){location.replace(E.items[0].url)}
else if(E){
  box.innerHTML='<h1>📋 '+esc(E.t)+'</h1>'+(E.items.length>1?'<p>보고 싶은 실험을 고르세요.</p>':'')+
    E.items.map(function(it){return '<a class="go" href="'+it.url+'">▶ '+esc(it.label)+'</a>'}).join('')+
    (E.note?'<div class="tip">'+esc(E.note)+'</div>':'')+
    '<a class="sub" href="index.html">기본 실험으로</a> · <a class="sub" href="lab.html">직접 실험으로</a>';
}else{
  box.innerHTML='<h1>모형을 찾지 못했어요</h1><p>QR 코드: '+esc(code||'(없음)')+'</p>'+
    '<a class="go" href="index.html">▶ 기본 실험<small>금속판과 수용액을 골라 반응 보기</small></a>'+
    '<a class="go" href="lab.html">▶ 직접 실험<small>이온과 금속의 개수를 넣어 문제 풀기</small></a>';
}
</script>
</body>
</html>
